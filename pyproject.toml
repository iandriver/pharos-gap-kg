[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharos-gap-kg"
version = "0.0.1"
description = "An agent-built knowledge graph from Pharos snapshots: every edge carries its lineage, every pruned edge stays as a typed gap, and predictions are scored on links that appeared later"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ian Driver" }]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=15",
  "kgx-gaps @ git+https://github.com/iandriver/kgx-gaps@4eef0128c8d3dc646213d37f6ddc3f6559830504",
]

[project.optional-dependencies]
test = ["pytest>=7"]
server = ["mcp>=2,<3"]
eval = ["scipy>=1.11"]
model = ["torch>=2.2"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pharos_gap_kg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
